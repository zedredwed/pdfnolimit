name: Feature request
description: Suggest something PDFNoLimit should be able to do
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Good feature requests describe a **problem**, not a button. Tell us what
        you were trying to get done and where the tools left you stuck — that
        usually leads somewhere better than the feature you had in mind.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task itself, in your own words.
      placeholder: >
        I receive scanned invoices and need to pull the totals into a spreadsheet
        without sending client data to a server.
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: How do you handle it today?
      description: What you currently do instead, and why it is painful.
    validations:
      required: false

  - type: textarea
    id: idea
    attributes:
      label: What do you have in mind?
      description: Optional. If you already picture a solution, describe it.
    validations:
      required: false

  - type: dropdown
    id: frequency
    attributes:
      label: How often would you use this?
      options:
        - Several times a day
        - A few times a week
        - A few times a month
        - Rarely, but it blocks me when it happens
    validations:
      required: true
